<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketball Arcade Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#121212;
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

h1{
margin-bottom:15px;
}

.stats{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:15px;
}

.stat{
background:#222;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
}

#court{
width:360px;
height:520px;
background:linear-gradient(#ffe9a8,#d6b86e);
border:5px solid black;
border-radius:12px;
position:relative;
overflow:hidden;
}

#hoop{
position:absolute;
width:90px;
height:70px;
top:60px;
left:0;
}

#backboard{
width:100%;
height:45px;
background:white;
border:3px solid black;
}

#rim{
position:absolute;
width:55px;
height:8px;
background:red;
left:50%;
transform:translateX(-50%);
top:42px;
border-radius:5px;
}

#ball{
width:38px;
height:38px;
background:orange;
border-radius:50%;
border:2px solid black;
position:absolute;
bottom:20px;
left:160px;
}

#powerContainer{
width:360px;
height:18px;
border:2px solid white;
margin-top:15px;
border-radius:20px;
overflow:hidden;
}

#powerFill{
height:100%;
width:0%;
background:lime;
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#shootBtn{
background:#ff5a00;
color:white;
}

#restartBtn{
background:#3498db;
color:white;
}

.particle{
position:absolute;
pointer-events:none;
border-radius:50%;
}

#gameOver{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:28px;
font-weight:bold;
z-index:10;
}
</style>
</head>
<body>

<h1>🏀 Basketball Arcade Pro</h1>

<div class="stats">

<div class="stat">Combo: <span id="combo">0</span></div>
<div class="stat">Accuracy: <span id="accuracy">0%</span></div>
<div class="stat">Time: <span id="time">60</span></div>
<div class="stat">Best: <span id="best">0</span></div>
</div>

<div id="court">

<div id="gameOver">

</div>

<div id="rim"></div>
</div>

<div id="ball"></div>

</div>

<div id="powerContainer">
<div id="powerFill"></div>
</div>

<div class="controls">
<button id="shootBtn">SHOOT</button>
<button id="restartBtn">RESTART</button>
</div>
