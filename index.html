<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Basketball Shooter</title>
<style>
/* simple beginner style, cleaned & fixed */
body{margin:0;background:#071022;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:10px 0}
#game{width:880px;height:480px;max-width:98vw;background:linear-gradient(#e3b07a,#d09b4a);border-radius:12px;position:relative;overflow:hidden;border:3px solid rgba(0,0,0,0.25)}
#hoop{position:absolute;right:70px;top:60px;width:140px;height:120px}
.backboard{width:140px;height:46px;background:#fff;border-radius:4px;border:3px solid #222;box-shadow:0 6px 20px rgba(0,0,0,0.15)}
.rim{position:absolute;left:30px;top:64px;width:80px;height:14px;border-radius:14px;
  background:linear-gradient(180deg,#e04b3b 0%,#b32a22 60%);box-shadow:0 10px 18px rgba(0,0,0,0.5), inset 0 -6px 8px rgba(0,0,0,0.35);transform-origin:center}
.rim::after{content:"";position:absolute;left:6px;right:6px;top:2px;height:5px;border-radius:6px;background:rgba(255,255,255,0.08)}
.rim.flash{animation:rimFlash 300ms ease both}
@keyframes rimFlash{0%{transform:scale(1)}50%{transform:scale(1.06);box-shadow:0 10px 28px rgba(255,200,50,0.9)}100%{transform:scale(1)}}

/* ball: orange with black outline */
#ball{position:absolute;width:56px;height:56px;border-radius:50%;left:80px;bottom:28px;pointer-events:none;display:flex;align-items:center;justify-content:center;transform-origin:center;
  background:#ff8a00;border:3px solid #000;box-shadow:0 6px 12px rgba(0,0,0,0.35);}

/* power bar & controls */
#powerWrap{width:880px;max-width:98vw;height:14px;background:rgba(0,0,0,0.08);border-radius:10px;margin-top:10px;border:2px solid rgba(255,255,255,0.04);overflow:hidden}
#power{height:100%;width:0;background:linear-gradient(90deg,#7cff57,#ffd54f,#ff6b6b)}
.controls{margin-top:10px;display:flex;gap:8px}
button{padding:10px 14px;border-radius:8px;border:none;background:#ff5722;color:#fff;cursor:pointer;font-weight:700}

/* HUD */
.hud{display:flex;gap:8px;margin-bottom:8px}
.hud .box{background:rgba(255,255,255,0.06);padding:6px 10px;border-radius:8px}

/* simple confetti pieces */
.p{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none}
@media(max-width:720px){#game{height:300px}}
</style>
</head>
<body>
<h1>Basketball Shooter</h1>
<div class="hud">
  <div class="box">Score: <span id="score">0</span></div>
  <div class="box">Shots: <span id="shots">0</span></div>
</div>

<div id="game" aria-label="basketball court">
  <div id="hoop">
    <div class="backboard"></div>
    <div class="rim"></div>
  </div>
  <div id="ball" aria-hidden="true"></div>
</div>

<div id="powerWrap"><div id="power"></div></div>
<div class="controls">
  <button id="shootBtn">Hold to charge → release</button>
</div>

<script>
// cleaned & tested: scoring only when the ball touches the red rim edge (not backboard or below),
// immediate reset on touch with effects, improved reliability and fun bits.

const game = document.getElementById('game');
const ballEl = document.getElementById('ball');
const hoop = document.getElementById('hoop');
const rimEl = document.querySelector('.rim');
const powerBar = document.getElementById('power');
const scoreEl = document.getElementById('score');
const shotsEl = document.getElementById('shots');

let score = 0, shots = 0;
let charging = false, power = 0, powerDir = 1;
const ballSize = 56;
const ballRadius = ballSize/2;
const ballState = { x:80, y:28, vx:0, vy:0, active:false, spin:0, scored:false };

// audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ audioCtx = new AudioCtx(); if(audioCtx.state === 'suspended') audioCtx.resume(); } }
function playTone(freq, dur=0.12, vol=0.08){
  ensureAudio();
  if(!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

// draw & reset
function drawBall(){
  ballEl.style.left = ballState.x + 'px';
  ballEl.style.bottom = ballState.y + 'px';
  ballEl.style.transform = `rotate(${ballState.spin}rad)`;
}
function resetBall(){
  ballState.x = 80; ballState.y = 28; ballState.vx = 0; ballState.vy = 0;
  ballState.active = false; ballState.spin = 0; ballState.scored = false;
  drawBall();
}
function updateHUD(){ scoreEl.textContent = score; shotsEl.textContent = shots; }

// charge/shoot
function startCharge(){ if(ballState.active) return; charging = true; power = 0; powerDir = 1; ensureAudio(); }
function releaseShot(){
  if(!charging || ballState.active) return;
  charging = false; shots++;
  ballState.active = true; ballState.scored = false;
  ballState.vy = 9 + power * 0.13;
  const hoopCx = hoop.offsetLeft + rimEl.offsetLeft + rimEl.clientWidth/2;
  ballState.vx = (hoopCx - (ballState.x + ballRadius)) / 85 + (Math.random()-0.5)*0.06;
  ballState.spin = ballState.vx * 0.3;
}

// rim center in game coordinates (x from left, y from bottom)
function rimCenter(){
  const gameH = game.clientHeight;
  const cx = hoop.offsetLeft + rimEl.offsetLeft + rimEl.clientWidth/2;
  const cy = gameH - (hoop.offsetTop + rimEl.offsetTop + rimEl.clientHeight/2);
  const r = rimEl.clientWidth/2;
  return {cx, cy, r};
}

function updatePower(){
  if(!charging) return;
  power += powerDir * 3;
  if(power > 100){ power = 100; powerDir = -1; }
  if(power < 0){ power = 0; powerDir = 1; }
  powerBar.style.width = power + '%';
}

// confetti
function confetti(x,y,count=14){
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'p';
    p.style.left = x + 'px';
    p.style.bottom = y + 'px';
    p.style.background = `hsl(${Math.random()*360} 80% 60%)`;
    game.appendChild(p);
    const tx = (Math.random()-0.5)*160;
    const ty = Math.random()*140;
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${tx}px,${ty}px)`,opacity:0}],{duration:700+Math.random()*300});
    setTimeout(()=>p.remove(),1000);
  }
}

// New robust rim-touch detection:
// require ball be near the rim edge (distance near rim radius) AND at rim vertical zone,
// avoid awarding for backboard hits or when ball is far below rim.
function handleRimTouchScore(){
  const rc = rimCenter();
  const bx = ballState.x + ballRadius;
  const by = ballState.y + ballRadius;
  const dx = bx - rc.cx;
  const dy = by - rc.cy;
  const dist = Math.hypot(dx, dy);
  const rimOuter = rc.r;

  // conditions
  const edgeTolerance = 0.7 * ballRadius + 6; // how close to rim radius counts as a touch
  const nearEdge = Math.abs(dist - rimOuter) <= edgeTolerance;
  const nearVertical = Math.abs(by - rc.cy) <= 26; // must be roughly at rim height
  const notBehindBackboard = bx <= (hoop.offsetLeft + 10 + 120); // avoid scoring when ball is behind backboard

  if(nearEdge && nearVertical && notBehindBackboard){
    if(!ballState.scored){
      ballState.scored = true;
      score++;
      updateHUD();
      // effects
      playTone(880, 0.12, 0.12);
      playTone(520, 0.08, 0.06);
      rimEl.classList.add('flash');
      setTimeout(()=>rimEl.classList.remove('flash'), 300);
      ballEl.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
      confetti(ballState.x + ballRadius, ballState.y + ballRadius, 14);
    }
    // reset after short delay so player sees effect
    ballState.active = false;
    setTimeout(resetBall, 220);
    return true;
  }
  return false;
}

function updateBall(){
  if(!ballState.active) return;

  ballState.x += ballState.vx;
  ballState.y += ballState.vy;
  ballState.vy -= 0.35; // gravity
  ballState.spin += ballState.vx * 0.08;

  // check rim touch and award/reset
  handleRimTouchScore();
  drawBall();

  // floor reset
  if(ballState.y <= 28){
    ballState.active = false;
    setTimeout(resetBall, 120);
  }

  // keep ball inside horizontally so it doesn't drift off-screen
  if(ballState.x < 8) ballState.x = 8;
  if(ballState.x + ballSize > game.clientWidth - 8) ballState.x = game.clientWidth - ballSize - 8;
}

// main loop
function loop(){
  updatePower();
  updateBall();
  requestAnimationFrame(loop);
}

// input handlers
const btn = document.getElementById('shootBtn');
btn.addEventListener('mousedown', startCharge);
btn.addEventListener('mouseup', releaseShot);
btn.addEventListener('touchstart', e=>{ e.preventDefault(); startCharge(); }, {passive:false});
btn.addEventListener('touchend', e=>{ e.preventDefault(); releaseShot(); }, {passive:false});
document.addEventListener('keydown', e=>{ if(e.code === 'Space'){ if(!charging) startCharge(); else releaseShot(); } });

// init
resetBall();
updateHUD();
loop();
</script>
</body>
</html>
