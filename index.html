<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketball Arcade Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#121212;
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

h1{
margin-bottom:15px;
}

.stats{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-bottom:15px;
}

.stat{
background:#222;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
}

#court{
width:360px;
height:520px;
background:linear-gradient(#ffe9a8,#d6b86e);
border:5px solid black;
border-radius:12px;
position:relative;
overflow:hidden;
}

#hoop{
position:absolute;
width:90px;
height:70px;
top:60px;
left:0;
}

#backboard{
width:100%;
height:45px;
background:white;
border:3px solid black;
}

#rim{
position:absolute;
width:55px;
height:8px;
background:red;
left:50%;
transform:translateX(-50%);
top:42px;
border-radius:5px;
}

#ball{
width:38px;
height:38px;
background:orange;
border-radius:50%;
border:2px solid black;
position:absolute;
bottom:20px;
left:160px;
}

#powerContainer{
width:360px;
height:18px;
border:2px solid white;
margin-top:15px;
border-radius:20px;
overflow:hidden;
}

#powerFill{
height:100%;
width:0%;
background:lime;
}

.controls{
margin-top:15px;
display:flex;
gap:10px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#shootBtn{
background:#ff5a00;
color:white;
}

#restartBtn{
background:#3498db;
color:white;
}

.particle{
position:absolute;
pointer-events:none;
border-radius:50%;
}

#gameOver{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.8);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
font-size:28px;
font-weight:bold;
z-index:10;
}
</style>
</head>
<body>

<h1>🏀 Basketball Arcade Pro</h1>

<div class="stats">
<div class="stat">Score: <span id="score">0</span></div>
<div class="stat">Combo: <span id="combo">0</span></div>
<div class="stat">Accuracy: <span id="accuracy">0%</span></div>
<div class="stat">Time: <span id="time">60</span></div>
<div class="stat">Best: <span id="best">0</span></div>
</div>

<div id="court">

<div id="gameOver">
<div>GAME OVER</div>
<div id="finalScore"></div>
</div>

<div id="hoop">
<div id="backboard"></div>
<div id="rim"></div>
</div>

<div id="ball"></div>

</div>

<div id="powerContainer">
<div id="powerFill"></div>
</div>

<div class="controls">
<button id="shootBtn">SHOOT</button>
<button id="restartBtn">RESTART</button>
</div>

<script>

const court = document.getElementById("court");
const hoop = document.getElementById("hoop");
const ballEl = document.getElementById("ball");
const powerFill = document.getElementById("powerFill");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const accEl = document.getElementById("accuracy");
const timeEl = document.getElementById("time");

const gameOverEl = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");

const bestEl = document.getElementById("best");

let best = Number(localStorage.getItem("basketballBest") || 0);
bestEl.textContent = best;

let score=0;
let combo=0;
let shots=0;
let makes=0;

let gameTime=60;
let running=true;

let hoopX=0;
let hoopSpeed=3;

let charging=false;
let power=0;
let powerDirection=1;

const ball={
x:160,
y:20,
vx:0,
vy:0,
active:false,
scored:false
};

function resetBall(){
ball.x=160;
ball.y=20;
ball.vx=0;
ball.vy=0;
ball.active=false;
ball.scored=false;
drawBall();
}

function drawBall(){
ballEl.style.left=ball.x+"px";
ballEl.style.bottom=ball.y+"px";
}

function updateStats(){

scoreEl.textContent=score;
comboEl.textContent=combo;

const acc=
shots===0 ?
0 :
Math.round((makes/shots)*100);

accEl.textContent=acc+"%";

if(score>best){
best=score;
localStorage.setItem("basketballBest",best);
}

bestEl.textContent=best;
}

function startCharge(){
if(ball.active||!running) return;
charging=true;
}

function releaseShot(){

if(!charging||ball.active||!running) return;

charging=false;

shots++;

ball.active=true;

const force=10+(power/100)*8;

ball.vy=force;
ball.vx=(Math.random()*2)-1;
}

function updatePower(){

if(!charging) return;

power += powerDirection*2;

if(power>=100){
power=100;
powerDirection=-1;
}

if(power<=0){
power=0;
powerDirection=1;
}

powerFill.style.width=power+"%";
}

function updateHoop(){

hoopX+=hoopSpeed;

if(hoopX<0 || hoopX>270){
hoopSpeed*=-1;
}

hoop.style.left=hoopX+"px";
}

function updateBall(){

if(!ball.active) return;

ball.x+=ball.vx;
ball.y+=ball.vy;

ball.vy-=0.4;

drawBall();

const hoopCenter=hoopX+45;
const ballCenter=ball.x+19;

if(
!ball.scored &&
ball.vy<0 &&
ball.y>70 &&
ball.y<130 &&
Math.abs(ballCenter-hoopCenter)<26
){
scoreBasket();
}

if(ball.y<20){
ball.active=false;
if(!ball.scored){
combo=0;
updateStats();
}
setTimeout(resetBall,150);
}
}

function scoreBasket(){

ball.scored=true;
ball.active=false;

makes++;
combo++;

score += combo;

if(Math.abs(hoopSpeed)<8){
hoopSpeed*=1.08;
}

updateStats();

spawnParticles();

setTimeout(resetBall,150);
}

function spawnParticles(){

for(let i=0;i<20;i++){

const p=document.createElement("div");

p.className="particle";

p.style.width="8px";
p.style.height="8px";

p.style.left=(ball.x+15)+"px";
p.style.bottom=(ball.y+15)+"px";

p.style.background=
`hsl(${Math.random()*360},100%,60%)`;

court.appendChild(p);

const dx=(Math.random()-0.5)*160;
const dy=(Math.random()-0.5)*160;

p.animate([
{
transform:"translate(0,0)",
opacity:1
},
{
transform:`translate(${dx}px,${dy}px)`,
opacity:0
}
],{
duration:700
});

setTimeout(()=>p.remove(),700);
}
}

function gameLoop(){

if(running){

updatePower();
updateHoop();
updateBall();

}

requestAnimationFrame(gameLoop);
}

document.getElementById("shootBtn")
.addEventListener("mousedown",startCharge);

document.getElementById("shootBtn")
.addEventListener("mouseup",releaseShot);

document.getElementById("shootBtn")
.addEventListener("touchstart",(e)=>{
e.preventDefault();
startCharge();
});

document.getElementById("shootBtn")
.addEventListener("touchend",(e)=>{
e.preventDefault();
releaseShot();
});

document.addEventListener("keydown",(e)=>{

if(e.code==="Space"){

e.preventDefault();

if(!charging){
startCharge();
}else{
releaseShot();
}
}
});

setInterval(()=>{

if(!running) return;

gameTime--;

timeEl.textContent=gameTime;

if(gameTime<=0){

running=false;

gameOverEl.style.display="flex";

finalScoreEl.textContent=
"Score: "+score;
}

},1000);

document
.getElementById("restartBtn")
.addEventListener("click",()=>{

location.reload();

});

resetBall();
updateStats();
gameLoop();

</script>

</body>
</html>
