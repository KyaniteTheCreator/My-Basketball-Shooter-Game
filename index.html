<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Arcade Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#141414;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px;
    color:white;
}

h1{
    margin-bottom:15px;
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.stat{
    background:#222;
    padding:10px 16px;
    border-radius:10px;
}

#court{
    width:350px;
    height:500px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(#f5e7a0,#d9be69);
    border:5px solid #000;
    border-radius:12px;
}

#hoop{
    width:90px;
    height:55px;
    position:absolute;
    top:80px;
    left:0;
}

.backboard{
    width:100%;
    height:45px;
    background:white;
    border:3px solid black;
}

.rim{
    position:absolute;
    width:52px;
    height:8px;
    background:red;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);
    border-radius:10px;
}

#ball{
    width:38px;
    height:38px;
    border-radius:50%;
    background:orange;
    border:3px solid #2d2d2d;
    position:absolute;
    left:156px;
    bottom:20px;
}

.line1,
.line2{
    position:absolute;
    background:#222;
}

.line1{
    width:3px;
    height:100%;
    left:50%;
}

.line2{
    width:100%;
    height:3px;
    top:50%;
}

#controls{
    margin-top:20px;
}

button{
    padding:12px 28px;
    border:none;
    border-radius:8px;
    background:#ff5500;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    transform:scale(1.05);
}

.particle{
    position:absolute;
    pointer-events:none;
    border-radius:50%;
}

</style>
</head>
<body>

<h1>🏀 Basketball Arcade Pro</h1>

<div class="stats">
    <div class="stat">Score: <span id="score">0</span></div>
    <div class="stat">Combo:
