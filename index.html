<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Challenge</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
min-height:100vh;
}

h1{
margin-bottom:15px;
}

.stats{
display:flex;
gap:15px;
margin-bottom:15px;
flex-wrap:wrap;
justify-content:center;
}

.card{
background:rgba(255,255,255,0.12);
padding:10px 15px;
border-radius:10px;
backdrop-filter:blur(5px);
}

#game{
width:400px;
height:600px;
max-width:95vw;
background:linear-gradient(#87ceeb,#f6d365);
border-radius:20px;
position:relative;
overflow:hidden;
border:4px solid white;
}

#hoop{
position:absolute;
top:90px;
width:90px;
height:60px;
}

.backboard{
width:90px;
height:40px;
background:white;
border:3px solid #222;
}

.rim{
width:55px;
height:8px;
background:red;
position:absolute;
left:17px;
top:38px;
border-radius:10px;
}

#ball{
position:absolute;
width:40px;
height:40px;
background:#ff7b00;
border-radius:50%;
left:180px;
bottom:25px;
border:2px solid #000;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

#powerWrap{
width:400px;
max-width:95vw;
height:18px;
margin-top:20px;
border-radius:20px;
border:2px solid white;
overflow:hidden;
}

#power{
height:100%;
width:0%;
background:linear-gradient(90deg,lime,gold,red);
}

button{
margin-top:15px;
padding:14px 26px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:12px;
background:#ff5722;
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

.particle{
position:absolute;
width:8px;
height:8px;
border-radius:50%;
pointer-events:none;
}
</style>
</head>
<body>

<h1>🏀 Basketball Challenge</h1>

<div class="stats">
<div class="card">Score: <span id="score">0</span></div>
<div class="card">Best: <span id="best">0</span></div>
<div class="card">Shots: <span id="shots">0</span></div>
</div>

<div id="game">

<div id="hoop">
<div class="backboard"></div>
<div class="rim"></div>
</div>

<div id="ball"></div>

</div>

<div id="powerWrap">
<div id="power"></div>
</div>

<button id="shootBtn">HOLD TO SHOOT</button>

<script>

const game = document.getElementById("game");
const hoop = document.getElementById("hoop");
const ballEl = document.getElementById("ball");
const powerBar = document.getElementById("power");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const shotsEl = document.getElementById("shots");

let best =
Number(localStorage.getItem("basketball-best") || 0);

bestEl.textContent = best;

let score = 0;
let shots = 0;

let hoopX = 0;
let hoopSpeed = 3;

let charging = false;
let power = 0;
let powerDirection = 1;

const ball = {
x:180,
y:25,
vx:0,
vy:0,
active:false,
scored:false
};

function resetBall(){
ball.x = 180;
ball.y = 25;
ball.vx = 0;
ball.vy = 0;
ball.active = false;
ball.scored = false;
drawBall();
}

function drawBall(){
ballEl.style.left = ball.x + "px";
ballEl.style.bottom = ball.y + "px";
}

function updateUI(){

scoreEl.textContent = score;
shotsEl.textContent = shots;

if(score > best){
best = score;
localStorage.setItem(
"basketball-best",
best
);
}

bestEl.textContent = best;
}

function startCharging(){

if(ball.active) return;
charging = true;

}

function releaseShot(){

if(!charging || ball.active)
return;

charging = false;

shots++;

ball.active = true;

ball.vy = 10 + power * 0.12;
ball.vx =
((hoopX + 45) - (ball.x + 20)) / 100;
}

function updatePower(){

if(!charging) return;

power += powerDirection * 2;

if(power > 100){
power = 100;
powerDirection = -1;
}

if(power < 0){
power = 0;
powerDirection = 1;
}

powerBar.style.width =
power + "%";
}

function updateHoop(){

hoopX += hoopSpeed;

if(hoopX < 0 || hoopX > 310){
hoopSpeed *= -1;
}

hoop.style.left = hoopX + "px";
}

function scoreBasket(){

ball.scored = true;
ball.active = false;

score++;

hoopSpeed *= 1.05;

updateUI();

for(let i = 0; i < 20; i++){

const p =
document.createElement("div");

p.className = "particle";

p.style.left =
(ball.x + 15) + "px";

p.style.bottom =
(ball.y + 15) + "px";

p.style.background =
`hsl(${Math.random()*360},
100%,60%)`;

game.appendChild(p);

const x =
(Math.random()-0.5)*150;

const y =
(Math.random()-0.5)*150;

p.animate([
{
transform:"translate(0,0)",
opacity:1
},
{
transform:
`translate(${x}px,${y}px)`,
opacity:0
}
],{
duration:800
});

setTimeout(()=>{
p.remove();
},800);
}

setTimeout(resetBall,200);
}

function updateBall(){

if(!ball.active) return;

ball.x += ball.vx;
ball.y += ball.vy;

ball.vy -= 0.35;

drawBall();

const hoopCenter =
hoopX + 45;

const ballCenter =
ball.x + 20;

if(
!ball.scored &&
ball.vy < 0 &&
ball.y > 85 &&
ball.y < 120 &&
Math.abs(
ballCenter - hoopCenter
) < 22
){
scoreBasket();
}

if(ball.y <= 25){

ball.active = false;

setTimeout(
resetBall,
200
);
}
}

function loop(){

updatePower();
updateHoop();
updateBall();

requestAnimationFrame(loop);
}

document
.getElementById("shootBtn")
.addEventListener(
"mousedown",
startCharging
);

document
.getElementById("shootBtn")
.addEventListener(
"mouseup",
releaseShot
);

document
.getElementById("shootBtn")
.addEventListener(
"touchstart",
e=>{
e.preventDefault();
startCharging();
}
);

document
.getElementById("shootBtn")
.addEventListener(
"touchend",
e=>{
e.preventDefault();
releaseShot();
}
);

document.addEventListener(
"keydown",
e=>{

if(e.code==="Space"){

if(!charging)
startCharging();
else
releaseShot();

}
});

resetBall();
updateUI();
loop();

</script>

</body>
</html>
